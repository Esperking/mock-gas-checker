<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo Radar Gas Finder</title>
    
    <!-- Supabase Client Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #6a0dad;
            display: flex;
            justify-content: center;
            padding: 30px 16px;
            margin: 0;
        }

        .app-container {
            background-color: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 480px;
        }

        h1, h2 {
            margin-top: 0;
            color: cadetblue;
            text-align: center;
        }

        .search-box, .add-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"], input[type="number"] {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 14px;
            background-color: darkgreen;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: deeppink;
        }

        .gps-btn {
            background-color: #007bff;
        }
        .gps-btn:hover {
            background-color: #0056b3;
        }

        /* Radar Map Styling */
        .map-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            background: #1e1e2f;
            border-radius: 8px;
            padding: 12px;
        }

        canvas {
            background: #111118;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0,255,255,0.2);
        }

        .map-label {
            color: #00ffcc;
            font-size: 12px;
            margin-top: 8px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .results-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .station-card {
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            padding: 14px 16px;
            background: #fafbfc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .station-card.cheapest {
            border: 2px solid #28a745;
            background: #f0fff4;
        }

        .badge {
            background: #28a745;
            color: white;
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .station-info h3 {
            margin: 0 0 4px 0;
            color: #333;
            font-size: 16px;
        }

        .station-info p {
            margin: 0;
            color: #666;
            font-size: 13px;
        }

        .price-tag {
            font-size: 20px;
            font-weight: bold;
            color: #155724;
        }

        .faith-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
            color: white;
            margin-left: 6px;
        }
        .faith-high { background-color: #28a745; }   /* 🟢 Green: Fresh & Verified */
        .faith-moderate { background-color: #e0a800; } /* 🟡 Yellow: Aging Data */
        .faith-stale { background-color: #dc3545; }    /* 🔴 Red: Old / Low Faith */

        .no-results {
            text-align: center;
            color: #777;
            margin-top: 12px;
        }

        hr {
            margin: 20px 0;
            border: 0;
            border-top: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <h1>⛽ Geo Radar Gas Finder</h1>

        <!-- SEARCH & MAP SECTION -->
        <div class="search-box">
            <button id="gps-search-btn" class="gps-btn">📍 Scan 5-Mile Radius & Radar Map</button>
        </div>

        <!-- MOCK 5-MILE RADAR MAP CANVAS -->
        <div class="map-container">
            <canvas id="radarCanvas" width="260" height="260"></canvas>
            <div class="map-label">5-Mile Radius Radar View</div>
        </div>

        <div id="results-list" class="results-container"></div>

        <hr>

        <!-- STREAMLINED CROWDSOURCE FORM (PIN ONLY) -->
        <!-- STREAMLINED CROWDSOURCE FORM (PIN ONLY) -->
        <h2>Submit Price & Pin</h2>
        <div class="add-box">
            <!-- 1. Added list="known-stations" and autocomplete="off" -->
            <input id="new-name" type="text" placeholder="Station Name (e.g. Speedway)" list="known-stations" autocomplete="off">
            
            <!-- 2. The Godot-style Enum Dropdown List -->
            <datalist id="known-stations">
                <option value="Speedway">
                <option value="Marathon">
                <option value="BP">
                <option value="Circle K">
                <option value="Shell">
                <option value="Costco Gasoline">
                <option value="Meijer Express">
                <option value="Exxon">
                <option value="Chevron">
                <option value="Wawa">
                <option value="Sheetz">
            </datalist>

            <input id="new-price" type="number" step="0.01" placeholder="Price (e.g. 3.19)">
            <button id="gps-tag-btn" class="gps-btn">📍 Drop GPS Pin at Current Location</button>
            <button id="add-btn">Save to Cloud Database</button>
        </div>
    </div>

<script>
    // 1. SUPABASE CLOUD CONNECTION
    const SUPABASE_URL = 'https://gtwoqrymxyzqzmutuplv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_l6qW68jDY4J6BSwS9nAnrw_37PHghDi';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // DOM References
    const gpsSearchBtn = document.querySelector('#gps-search-btn');
    const resultsList = document.querySelector('#results-list');
    const canvas = document.querySelector('#radarCanvas');
    const ctx = canvas.getContext('2d');

    const newName = document.querySelector('#new-name');
    const newPrice = document.querySelector('#new-price');
    const gpsTagBtn = document.querySelector('#gps-tag-btn');
    const addBtn = document.querySelector('#add-btn');

    let capturedLatitude = null;
    let capturedLongitude = null;

    // Draw initial blank radar grid on load
    drawRadarMap([]);

    // 2. HAVERSINE DISTANCE FORMULA (miles)
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 3958.8;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = 
            Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
            Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    // 3. DRAW CUSTOM 5-MILE RADAR MAP ON CANVAS
    function drawRadarMap(stations, userLat, userLon) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const maxRadiusPixels = 110; // 5 miles outer ring

        // Draw radar circles (1mi, 3mi, 5mi rings)
        [0.2, 0.6, 1.0].forEach(function(scale) {
            ctx.beginPath();
            ctx.arc(centerX, centerY, maxRadiusPixels * scale, 0, 2 * Math.PI);
            ctx.strokeStyle = '#22223b';
            ctx.lineWidth = 1;
            ctx.stroke();
        });

        // Draw crosshairs
        ctx.strokeStyle = '#22223b';
        ctx.beginPath();
        ctx.moveTo(centerX, 15); ctx.lineTo(centerX, canvas.height - 15);
        ctx.moveTo(15, centerY); ctx.lineTo(canvas.width - 15, centerY);
        ctx.stroke();

        // Draw User Center Pin (Blue)
        ctx.fillStyle = '#007bff';
        ctx.beginPath();
        ctx.arc(centerX, centerY, 6, 0, 2 * Math.PI);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // If we have stations and user GPS, plot them relative to center
        if (userLat && userLon && stations) {
            stations.forEach(function(station, index) {
                if (!station.latitude || !station.longitude) return;

                // Approximate delta in miles (1 degree lat ~= 69 miles)
                const dLatMiles = (station.latitude - userLat) * 69;
                const dLonMiles = (station.longitude - userLon) * 69 * Math.cos(userLat * Math.PI / 180);

                // Map miles to canvas pixels (5 miles = maxRadiusPixels)
                const xOffset = (dLonMiles / 5) * maxRadiusPixels;
                const yOffset = -(dLatMiles / 5) * maxRadiusPixels; // Invert Y for screen coords

                const plotX = centerX + xOffset;
                const plotY = centerY + yOffset;

                // Keep dots inside radar bounds
                const distFromCenter = Math.sqrt(xOffset*xOffset + yOffset*yOffset);
                if (distFromCenter <= maxRadiusPixels) {
                    ctx.fillStyle = index === 0 ? '#28a745' : '#ffc107'; // Green for cheapest, yellow for others
                    ctx.beginPath();
                    ctx.arc(plotX, plotY, 5, 0, 2 * Math.PI);
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }
            });
        }
    }

    // 4. SCAN RADAR & FETCH NEARBY STATIONS VIA GPS
    async function scanRadarAndSearch() {
        resultsList.innerHTML = "<p class='no-results'>Acquiring GPS location...</p>";

        if (!navigator.geolocation) {
            alert("Geolocation is not supported by your browser.");
            resultsList.innerHTML = "";
            return;
        }

        navigator.geolocation.getCurrentPosition(async function(position) {
            const userLat = position.coords.latitude;
            const userLon = position.coords.longitude;

            resultsList.innerHTML = "<p class='no-results'>Scanning 5-mile radius...</p>";

            const { data: stations, error } = await db
                .from('stations')
                .select('*');

            if (error) {
                console.error('Supabase fetch error:', error);
                resultsList.innerHTML = "<p class='no-results'>Error connecting to cloud.</p>";
                return;
            }

            if (!stations || stations.length === 0) {
                resultsList.innerHTML = "<p class='no-results'>No stations in database yet. Drop a pin below!</p>";
                drawRadarMap([], userLat, userLon);
                return;
            }

            // Calculate distance & filter within 5 miles
            const nearbyStations = stations.filter(function(station) {
                if (!station.latitude || !station.longitude) return false;
                const distance = calculateDistance(userLat, userLon, station.latitude, station.longitude);
                station.distance = distance;
                return distance <= 5;
            });

            // Sort cheapest first
            nearbyStations.sort(function(a, b) {
                return a.price - b.price;
            });

            // Redraw radar with plotted stations
            drawRadarMap(nearbyStations, userLat, userLon);
            renderStations(nearbyStations);

        }, function(error) {
            alert("Location access denied or timed out. Make sure you are using Live Server!");
            resultsList.innerHTML = "";
        }, { timeout: 10000 });
    }

    // 5. TAG CURRENT GPS LOCATION FOR SUBMISSION WITH ACCURACY CHECK
    gpsTagBtn.addEventListener('click', function() {
        if (!navigator.geolocation) {
            alert("Geolocation not supported.");
            return;
        }
        gpsTagBtn.textContent = "📍 Acquiring GPS Lock...";
        
        navigator.geolocation.getCurrentPosition(function(position) {
            const accuracy = position.coords.accuracy; // Accuracy in meters
            console.log("GPS Accuracy reading:", accuracy, "meters");

            // Drift Protection: If accuracy worse than 50 meters (~160 feet)
            if (accuracy > 50) {
                const proceed = confirm(`⚠️ Weak GPS signal detected (~${Math.round(accuracy)}m accuracy). You might be indoors or near tall buildings. Drop pin anyway?`);
                if (!proceed) {
                    gpsTagBtn.textContent = "📍 Drop GPS Pin at Current Location";
                    gpsTagBtn.style.backgroundColor = "#007bff";
                    return;
                }
            }

            capturedLatitude = position.coords.latitude;
            capturedLongitude = position.coords.longitude;
            gpsTagBtn.textContent = `📍 GPS Locked (${Math.round(accuracy)}m) ✓`;
            gpsTagBtn.style.backgroundColor = "#28a745";
        }, function(error) {
            alert("Failed to get GPS location. Please check your browser permissions.");
            gpsTagBtn.textContent = "📍 Drop GPS Pin at Current Location";
            gpsTagBtn.style.backgroundColor = "#007bff";
        }, { 
            enableHighAccuracy: true, // Forces the phone to use real GPS hardware instead of Wi-Fi triangulation
            timeout: 10000, 
            maximumAge: 0 
        });
    });

    // 6. SUBMIT TO CLOUD DATABASE
async function submitGasPrice() {
    const name = newName.value.trim();
    const price = parseFloat(newPrice.value);

    // 1. Basic & Anti-Troll Validation
    if (!name || isNaN(price)) {
        alert("Please enter a station name and valid price!");
        return;
    }

    if (price < 1.00 || price > 10.00) {
        alert("Please enter a realistic gas price between $1.00 and $10.00.");
        return;
    }

    if (capturedLatitude === null || capturedLongitude === null) {
        alert("Please click 'Drop GPS Pin at Current Location' first!");
        return;
    }

    // 🛡️ DEFENSE LAYER 1: COOLDOWN TIMER (15-Minute Rate Limit)
    const cooldownMinutes = 15;
    const lastSubmission = localStorage.getItem('last_gas_submission');
    if (lastSubmission) {
        const minutesPassed = (Date.now() - parseInt(lastSubmission)) / (1000 * 60);
        if (minutesPassed < cooldownMinutes) {
            const waitTime = Math.ceil(cooldownMinutes - minutesPassed);
            alert(`⏳ Rate limit active: Please wait ${waitTime} more minute(s) before submitting another price update.`);
            return;
        }
    }

    // 2. DUPLICATE CHECK: Fetch existing stations from Supabase first
    const { data: existingStations, fetchError } = await db
        .from('stations')
        .select('*');

    if (fetchError) {
        console.error('Error checking existing stations:', fetchError);
    }

    // Helper math function to calculate distance in miles (Haversine formula)
    function getDistanceFromLatLonInMiles(lat1, lon1, lat2, lon2) {
        const R = 3958.8; // Radius of the earth in miles
        const dLat = deg2rad(lat2 - lat1);
        const dLon = deg2rad(lon2 - lon1);
        const a = 
            Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * 
            Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }
    function deg2rad(deg) {
        return deg * (Math.PI / 180);
    }

    // Look for any station within 0.03 miles (~50 meters) of current GPS pin
    let matchingStation = null;
    if (existingStations) {
        matchingStation = existingStations.find(station => {
            const distance = getDistanceFromLatLonInMiles(
                capturedLatitude, capturedLongitude, 
                station.latitude, station.longitude
            );
            return distance <= 0.03; // Within ~50 meters
        });
    }

    // 🛡️ DEFENSE LAYER 2: PERCENTAGE JUMP GUARDRAIL (Anomaly Detection)
    if (matchingStation) {
        const priceDiffPercent = Math.abs(price - matchingStation.price) / matchingStation.price;
        if (priceDiffPercent > 0.30) { // More than 30% swing
            const confirmAnomaly = confirm(`⚠️ Price Alert: $${price.toFixed(2)} is more than 30% different from the current recorded price ($${Number(matchingStation.price).toFixed(2)}). Is this correct?`);
            if (!confirmAnomaly) return;
        }
    }

    let error;

    if (matchingStation) {
        // 3A. UPDATE EXISTING STATION (Prevent Duplicate)
        console.log("Found nearby station, updating existing record ID:", matchingStation.id);
        const response = await db
            .from('stations')
            .update({ 
                name: name, 
                price: price, 
                created_at: new Date().toISOString() // Refreshes timestamp
            })
            .eq('id', matchingStation.id);
        
        error = response.error;
    } else {
        // 3B. INSERT NEW STATION
        console.log("No nearby station found. Creating new pin.");
        const response = await db
            .from('stations')
            .insert([
                { 
                    name: name, 
                    address: "Pinned GPS Location", 
                    price: price,
                    latitude: capturedLatitude,
                    longitude: capturedLongitude,
                    zip: "00000"
                }
            ]);
            
        error = response.error;
    }

    if (error) {
        console.error('Supabase save error:', error);
        alert("Failed to save to cloud database.");
        return;
    }

    // Stamp the successful submission time into browser localStorage
    localStorage.setItem('last_gas_submission', Date.now().toString());

    alert(matchingStation ? "Success! Updated price for nearby station." : "Success! New station and GPS pin saved.");

    // Reset form
    newName.value = "";
    newPrice.value = "";
    capturedLatitude = null;
    capturedLongitude = null;
    gpsTagBtn.textContent = "📍 Drop GPS Pin at Current Location";
    gpsTagBtn.style.backgroundColor = "#007bff";

    scanRadarAndSearch();
}

    // Helper function to calculate time elapsed
    // Helper function to calculate time elapsed
    function getTimeAgo(dateString) {
        if (!dateString) return "Recently";
        const now = new Date();
        const updated = new Date(dateString);
        const hoursAgo = Math.floor((now - updated) / (1000 * 60 * 60));
        
        if (hoursAgo < 1) return "Just now";
        if (hoursAgo === 1) return "1 hour ago";
        if (hoursAgo < 24) return `${hoursAgo} hours ago`;
        const daysAgo = Math.floor(hoursAgo / 24);
        return `${daysAgo} day(s) ago`;
    }

    // 🌟 NEW: Calculate Confidence / Faith Rating based on recency
    function getConfidenceLevel(dateString) {
        if (!dateString) return { label: "Moderate Faith", class: "faith-moderate" };
        
        const now = new Date();
        const updated = new Date(dateString);
        const hoursAgo = (now - updated) / (1000 * 60 * 60);

        if (hoursAgo <= 3) {
            return { label: "High Faith", class: "faith-high" };       // 🟢 Green (< 3 hours)
        } else if (hoursAgo <= 12) {
            return { label: "Moderate", class: "faith-moderate" };   // 🟡 Yellow (3 - 12 hours)
        } else {
            return { label: "Low Faith", class: "faith-stale" };       // 🔴 Red (> 12 hours)
        }
    }

    // 7. RENDER RESULTS CARDS
    function renderStations(stations) {
        resultsList.innerHTML = "";

        if (stations.length === 0) {
            resultsList.innerHTML = "<p class='no-results'>No gas stations found within 5 miles.</p>";
            return;
        }

        stations.forEach(function(station, index) {
            const card = document.createElement('div');
            card.classList.add('station-card');

            const isCheapest = index === 0;
            if (isCheapest) {
                card.classList.add('cheapest');
            }

            // Format timestamp and confidence rating
            const timeAgoText = getTimeAgo(station.created_at);
            const confidence = getConfidenceLevel(station.created_at);

            card.innerHTML = `
              <div class="station-info">
                <h3>
                    ${station.name} 
                    ${isCheapest ? '<span class="badge">Cheapest</span>' : ''}
                    <span class="faith-badge ${confidence.class}">${confidence.label}</span>
                </h3>
                <p>📍 ${station.distance.toFixed(1)} miles away • 🕒 ${timeAgoText}</p>
              </div>
              <div class="price-tag">$${Number(station.price).toFixed(2)}</div>
            `;

            resultsList.appendChild(card);
        });
    }

    // Event Listeners
    gpsSearchBtn.addEventListener('click', scanRadarAndSearch);
    addBtn.addEventListener('click', submitGasPrice);
</script>
</body>
</html>
